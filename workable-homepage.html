  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head>
  <link rel="icon" type="image/png" href="https://www.workable.com/favicon.ico"> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
  <link rel="icon" type="image/png" href="https://www.workable.com/favicon.ico">
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

"<!DOCTYPE html>\n<html lang=\"en\"><head>
  <link rel="icon" type="image/png" href="https://www.workable.com/favicon.ico">\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Workable — homepage mockup<\u002Ftitle>\n<style>\n@font-face{font-family:'Proxima Nova';src:url(\"3ebebb6a-8025-4f27-84fe-4306792c395e\") format('opentype');font-weight:400;font-style:normal;font-display:swap;}\n@font-face{font-family:'Proxima Nova';src:url(\"3d00e447-54b6-4cdf-9c67-146fa5e7657a\") format('opentype');font-weight:500;font-style:normal;font-display:swap;}\n@font-face{font-family:'Proxima Nova';src:url(\"b54d9368-d9dc-46a0-a03c-bd3b16a36a76\") format('opentype');font-weight:600;font-style:normal;font-display:swap;}\n@font-face{font-family:'Proxima Nova';src:url(\"c5c0d514-988a-4cdd-b370-a7104bf68c84\") format('opentype');font-weight:700;font-style:normal;font-display:swap;}\n:root{\n  /* brand greens (per spec) */\n  --pine:#0E776A;        /* primary */\n  --cyprus:#00534B;      /* dark headers / cover */\n  --cyprus-deep:#013A34; /* ribbon / footer */\n  --med-green:#17A269;   /* secondary accent */\n  --foam:#ECF2EC;        /* light cards / tinted sections */\n  --foam-soft:#F5F9F5;\n  /* text */\n  --charcoal:#333D49;    /* body */\n  --slate:#58616B;       /* muted */\n  --ink:#1B232C;         /* headlines */\n  /* neutral lines */\n  --line:#E4E8E6;\n  --line-soft:#EEF1EF;\n  --white:#FFFFFF;\n  /* type */\n  --sans:'Proxima Nova',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',sans-serif;\n  /* radii / shadow */\n  --r-sm:6px; --r-md:10px; --r-lg:14px; --r-xl:18px; --r-pill:999px;\n  --sh-sm:0 1px 3px rgba(20,40,35,.06),0 1px 2px rgba(20,40,35,.04);\n  --sh-md:0 6px 16px -4px rgba(20,40,35,.10),0 2px 6px -2px rgba(20,40,35,.06);\n  --sh-lg:0 18px 38px -10px rgba(14,60,52,.16),0 6px 12px -6px rgba(14,60,52,.08);\n  --sh-xl:0 30px 60px -18px rgba(14,60,52,.22),0 10px 20px -10px rgba(14,60,52,.10);\n}\n*{box-sizing:border-box;}\nhtml{scroll-behavior:smooth;}\nbody{\n  margin:0;background:var(--white);color:var(--charcoal);\n  font-family:var(--sans);font-size:18px;line-height:1.5;font-weight:400;\n  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;\n}\na{color:inherit;text-decoration:none;}\n.wrap{max-width:1200px;margin:0 auto;padding:0 32px;}\nh1,h2,h3,h4,p{margin:0;}\n.eyebrow{\n  font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;\n  color:var(--pine);\n}\n\n/* ---------- editable affordance ---------- */\n[contenteditable=\"true\"]{\n  border-radius:5px;outline:none;\n  transition:background .12s ease,box-shadow .12s ease;cursor:text;\n}\n[contenteditable=\"true\"]:hover{\n  background:rgba(14,119,106,.06);\n  box-shadow:0 0 0 4px rgba(14,119,106,.06);\n}\n[contenteditable=\"true\"]:focus{\n  background:rgba(14,119,106,.05);\n  box-shadow:0 0 0 2px var(--pine),0 0 0 6px rgba(14,119,106,.14);\n}\n.on-dark [contenteditable=\"true\"]:hover{\n  background:rgba(255,255,255,.10);box-shadow:0 0 0 4px rgba(255,255,255,.10);\n}\n.on-dark [contenteditable=\"true\"]:focus{\n  background:rgba(255,255,255,.08);box-shadow:0 0 0 2px rgba(255,255,255,.6);\n}\n\n/* ---------- buttons ---------- */\n.btn{\n  display:inline-flex;align-items:center;gap:8px;justify-content:center;\n  font-family:var(--sans);font-weight:600;font-size:16px;\n  padding:13px 22px;border-radius:var(--r-sm);border:1px solid transparent;\n  cursor:pointer;transition:background .15s ease,transform .08s ease,border-color .15s,color .15s;\n  white-space:nowrap;\n}\n.btn:active{transform:scale(.985);}\n.btn-primary{background:var(--pine);color:#fff;}\n.btn-primary:hover{background:var(--cyprus);}\n.btn-ghost{background:transparent;color:var(--ink);border-color:var(--line);}\n.btn-ghost:hover{background:var(--foam);border-color:#d4ded8;}\n.btn-link{background:transparent;color:var(--pine);font-weight:600;padding:13px 4px;}\n.btn-link:hover{color:var(--cyprus);}\n.btn-link .arr,.lk .arr{transition:transform .15s ease;display:inline-block;}\n.btn-link:hover .arr,.lk:hover .arr{transform:translateX(3px);}\n/* inline section link */\n.lk{display:inline-flex;align-items:center;gap:8px;color:var(--pine);font-weight:600;font-size:17px;}\n.lk:hover{color:var(--cyprus);}\n/* on dark */\n.btn-onpine-primary{background:#fff;color:var(--cyprus);}\n.btn-onpine-primary:hover{background:var(--foam);}\n.btn-onpine-ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.5);}\n.btn-onpine-ghost:hover{background:rgba(255,255,255,.12);}\n\n/* ---------- ribbon ---------- */\n.ribbon{background:var(--cyprus-deep);color:#fff;text-align:center;}\n.ribbon a{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;padding:9px 16px;font-size:14px;font-weight:500;color:rgba(255,255,255,.92);}\n.ribbon a:hover{color:#fff;}\n.ribbon .tag{font-weight:700;color:#fff;}\n.ribbon .arr{transition:transform .15s;display:inline-block;}\n.ribbon a:hover .arr{transform:translateX(3px);}\n\n/* ---------- nav ---------- */\n.nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}\n.nav-inner{display:flex;align-items:center;gap:36px;height:72px;}\n.brand{display:flex;align-items:center;gap:10px;color:var(--pine);}\n.brand-mark{width:30px;height:auto;display:block;}\n.brand-word{font-weight:700;font-size:23px;letter-spacing:-.02em;color:var(--ink);}\n.nav-links{display:flex;gap:28px;}\n.nav-links a{font-size:15px;font-weight:500;color:var(--charcoal);}\n.nav-links a:hover{color:var(--pine);}\n.nav-links a.nav-feature{color:var(--pine);font-weight:600;}\n.nav-spacer{flex:1;}\n.nav-actions{display:flex;align-items:center;gap:12px;}\n.nav-actions .signin{font-size:15px;font-weight:600;padding:8px 6px;color:var(--charcoal);}\n.nav-actions .signin:hover{color:var(--pine);}\n.nav-actions .btn{padding:10px 18px;font-size:15px;}\n\n/* ---------- hero ---------- */\n.hero{background:var(--white);}\n.hero-grid{display:grid;grid-template-columns:1.04fr .96fr;gap:60px;align-items:center;padding:88px 0 80px;}\n.hero h1{font-size:64px;line-height:1.04;font-weight:700;letter-spacing:-.028em;color:var(--ink);margin:0 0 26px;text-wrap:balance;}\n.hero-sub{font-size:20px;line-height:1.55;color:var(--slate);max-width:540px;}\n.hero-cta{display:flex;align-items:center;gap:16px;margin-top:36px;flex-wrap:wrap;}\n\n/* hero platform panel */\n.platform{background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-xl);overflow:hidden;}\n.platform-bar{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line-soft);background:var(--foam-soft);}\n.pf-dot{width:10px;height:10px;border-radius:50%;}\n.platform-body{padding:22px;}\n.pf-row{display:flex;gap:14px;}\n.pf-tile{flex:1;border:1px solid var(--line);border-radius:var(--r-md);padding:16px;background:#fff;}\n.pf-tile .ic{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;}\n.pf-tile .ic svg{width:19px;height:19px;}\n.pf-tile.pine .ic{background:var(--foam);color:var(--pine);}\n.pf-tile h4{font-size:15px;font-weight:700;color:var(--ink);margin:0 0 3px;}\n.pf-tile span{font-size:12.5px;color:var(--slate);}\n.pf-foot{display:flex;gap:0;margin-top:18px;border-top:1px solid var(--line-soft);padding-top:16px;}\n.pf-stat{flex:1;text-align:center;border-right:1px solid var(--line-soft);}\n.pf-stat:last-child{border-right:0;}\n.pf-stat b{display:block;font-size:22px;font-weight:700;color:var(--pine);letter-spacing:-.02em;}\n.pf-stat span{font-size:12px;color:var(--slate);}\n\n/* ---------- trust ---------- */\n.trust{padding:10px 0 56px;text-align:center;}\n.trust-line{font-size:15px;color:var(--slate);font-weight:500;}\n.logos{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:16px 44px;margin-top:26px;opacity:.6;}\n.logos span{font-weight:700;font-size:21px;color:var(--charcoal);letter-spacing:-. a\">Start a free trial<\u002Fspan><\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- ============ FOOTER ============ -->\n<footer class=\"foot on-dark\">\n  <div class=\"wrap\">\n    <div class=\"foot-top\">\n      <div class=\"foot-brand\">\n        <a class=\"brand\" href=\"#\">\n          <svg class=\"brand-mark\" viewBox=\"0 0 110 60\" fill=\"currentColor\" aria-hidden=\"true\">\n            <path d=\"M 63.15 29.211 C 66.408 23.437 68.111 18.328 68.037 14.405 C 67.963 9.518 66.038 5.891 63.15 3.522 C 54.563 -3.659 37.683 0.19 37.905 14.627 C 37.979 20.105 40.644 27.138 47.529 35.652 C 47.529 35.652 51.379 32.247 52.194 29.137 C 33.907 4.262 72.331 2.929 53.23 30.47 C 53.23 30.47 51.009 34.098 48.196 36.467 C 42.199 42.093 36.795 43.87 32.13 43.13 C 15.769 40.464 13.178 16.033 11.919 1.523 L 0 1.523 C 0 1.671 0 1.819 0 2.041 L 0 4.78 C 0.592 33.579 21.025 73.631 53.6 42.167 C 56.858 38.91 58.634 36.393 58.634 36.393 C 60.337 33.801 61.892 31.432 63.15 29.211 Z\"><\u002Fpath>\n            <path transform=\"translate(75.7, 20.2)\" d=\"M 32.797 0 C 32.723 0.37 32.649 0.74 32.575 1.185 C 30.354 18.064 20.581 32.353 5.775 24.505 C 5.478 24.875 5.182 25.319 4.886 25.69 C 3.406 27.466 1.703 28.947 0.148 30.206 C 0.074 30.206 0.074 30.132 0 30.132 C 1.629 31.168 3.257 31.982 4.886 32.575 C 23.098 39.608 39.756 22.21 41.385 0.37 L 32.797 0 Z\"><\u002Fpath>\n          <\u002Fsvg>\n          <span class=\"brand-word\">workable<\u002Fspan>\n        <\u002Fa>\n        <p class=\"foot-blurb\">A new operating model for hiring. A complete platform for HR.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"foot-col\">\n        <h5>Product<\u002Fh5>\n        <a href=\"#\">Workable Recruiting<\u002Fa>\n        <a href=\"#\">Workable HRIS<\u002Fa>\n        <a href=\"#\">Workable Agent<\u002Fa>\n        <a href=\"#\">Integrations<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"foot-col\">\n        <h5>Pricing<\u002Fh5>\n        <a href=\"#\">Plans<\u002Fa>\n        <a href=\"#\">Request a demo<\u002Fa>\n        <a href=\"#\">Free trial<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"foot-col\">\n        <h5>Customers<\u002Fh5>\n        <a href=\"#\">Customer stories<\u002Fa>\n        <a href=\"#\">Reviews<\u002Fa>\n        <a href=\"#\">Industries<\u002Fa>\n      <\u002Fdiv>\n      <div class=\"foot-col\">\n        <h5>Company<\u002Fh5>\n        <a href=\"#\">About<\u002Fa>\n        <a href=\"#\">Careers<\u002Fa>\n        <a href=\"#\">Resources<\u002Fa>\n        <a href=\"#\">Contact<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot-copy\" contenteditable=\"true\" data-doc=\"caption\">© 2026 Workable Technology Limited.<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Ffooter>\n<\u002Fmain>\n\n<!-- ============ FAB + tooltip ============ -->\n<div class=\"fab-wrap\">\n  <div class=\"fab-tip\">Click any text on the page to edit. <b>Save changes<\u002Fb> downloads a Word doc with your edits.<\u002Fdiv>\n  <button class=\"fab\" id=\"saveBtn\" type=\"button\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3\"><\u002Fpath><\u002Fsvg>\n    Save changes\n  <\u002Fbutton>\n<\u002Fdiv>\n<div class=\"toast\" id=\"toast\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><path d=\"M20 6L9 17l-5-5\"><\u002Fpath><\u002Fsvg><span id=\"toastMsg\">Saved<\u002Fspan><\u002Fdiv>\n\n<!-- docx library (CDN) -->\n<script src=\"fb27d2f6-b547-4947-b8d5-f5e54867b5e3\"><\u002Fscript>\n<script>\n(function(){\n  \"use strict\";\n  var STORE_KEY = \"wk-homepage-edits-v1\";\n\n  var editables = Array.prototype.slice.call(document.querySelectorAll('[contenteditable=\"true\"]'));\n\n  /* restore from localStorage */\n  try {\n    var saved = JSON.parse(localStorage.getItem(STORE_KEY) || \"null\");\n    if (saved && Array.isArray(saved) && saved.length === editables.length) {\n      editables.forEach(function(el, i){ if (saved[i] != null) el.innerHTML = saved[i]; });\n    }\n  } catch(e){}\n\n  /* persist (debounced) */\n  var saveTimer = null;\n  function persist(){\n    if (saveTimer) clearTimeout(saveTimer);\n    saveTimer = setTimeout(function(){\n      try {\n        var data = editables.map(function(el){ return el.innerHTML; });\n        localStorage.setItem(STORE_KEY, JSON.stringify(data));\n      } catch(e){}\n    }, 350);\n  }\n\n  /* keep structure stable on Enter */\n  function isSingleLine(el){\n    var r = el.getAttribute('data-doc');\n    return r === 'h1' || r === 'h2' || r === 'h3' || r === 'eyebrow' || r === 'cta';\n  }\n  editables.forEach(function(el){\n    el.addEventListener('input', persist);\n    el.addEventListener('keydown', function(e){\n      if (e.key === 'Enter'){\n        if (isSingleLine(el)) { e.preventDefault(); return; }\n        e.preventDefault();\n        document.execCommand('insertLineBreak');\n      }\n    });\n    el.addEventListener('paste', function(e){\n      e.preventDefault();\n      var text = (e.clipboardData || window.clipboardData).getData('text/plain');\n      document.execCommand('insertText', false, text);\n    });\n  });\n\n  /* helpers */\n  function dateStamp(){\n    var d = new Date(), p = function(n){ return String(n).padStart(2,'0'); };\n    return d.getFullYear() + \"-\" + p(d.getMonth()+1) + \"-\" + p(d.getDate());\n  }\n  function textOf(el){\n    return (el.innerText || \"\").replace(/\\u00a0/g,\" \").replace(/[ \\t]+\\n/g,\"\\n\").trim();\n  }\n  function oneLine(el){ return textOf(el).replace(/\\s*\\n+\\s*/g,\" \").trim(); }\n  function download(blob, name){\n    var url = URL.createObjectURL(blob);\n    var a = document.createElement('a');\n    a.href = url; a.download = name;\n    document.body.appendChild(a); a.click();\n    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);\n  }\n  function showToast(msg){\n    var t = document.getElementById('toast');\n    document.getElementById('toastMsg').textContent = msg;\n    t.classList.add('show');\n    setTimeout(function(){ t.classList.remove('show'); }, 2600);\n  }\n\n  /* build .docx */\n  function buildDocx(){\n    var d = window.docx;\n    var Paragraph = d.Paragraph, TextRun = d.TextRun, HeadingLevel = d.HeadingLevel;\n    var children = [];\n    var GREEN = \"0E776A\", GREY = \"58616B\";\n\n    var nodes = document.querySelectorAll('main [data-doc]');\n    Array.prototype.forEach.call(nodes, function(node){\n      var role = node.getAttribute('data-doc');\n      var t = (role === 'body' || role === 'caption') ? textOf(node) : oneLine(node);\n      if (!t) return;\n      var lines = t.split('\\n');\n\n      switch(role){\n        case 'h1':\n          children.push(new Paragraph({ text: lines.join(' '), heading: HeadingLevel.TITLE, spacing:{ before:240, after:120 } }));\n          break;\n        case 'h2':\n          children.push(new Paragraph({ text: lines.join(' '), heading: HeadingLevel.HEADING_1, spacing:{ before:320, after:120 } }));\n          break;\n        case 'h3':\n          children.push(new Paragraph({ text: lines.join(' '), heading: HeadingLevel.HEADING_2, spacing:{ before:160, after:80 } }));\n          break;\n        case 'eyebrow':\n          children.push(new Paragraph({ children:[ new TextRun({ text: lines.join(' ').toUpperCase(), bold:true, color:GREEN, size:18 }) ], spacing:{ before:240, after:40 } }));\n          break;\n        case 'caption':\n          children.push(new Paragraph({ children:[ new TextRun({ text: lines.join(' '), italics:true, color:GREY }) ], spacing:{ after:160 } }));\n          break;\n        case 'cta':\n          children.push(new Paragraph({ children:[ new TextRun({ text: \"[ Button ] \" + lines.join(' '), bold:true, color:GREEN }) ] }));\n          break;\n        default:\n          children.push(new Paragraph({\n            children: lines.map(function(ln, i){ return new TextRun({ text: ln, break: i>0 ? 1 : 0 }); }),\n            spacing:{ after:160 }\n          }));\n      }\n    });\n\n    var doc = new d.Document({\n      title: \"Workable homepage copy\",\n      styles: { default: { document: { run: { font: \"Calibri\", size: 22 } } } },\n      sections: [{ properties:{}, children: children }]\n    });\n    return d.Packer.toBlob(doc);\n  }\n\n  /* markdown fallback */\n  function buildMarkdown(){\n    var out = [];\n    var nodes = document.querySelectorAll('main [data-doc]');\n    Array.prototype.forEach.call(nodes, function(node){\n      var role = node.getAttribute('data-doc');\n      var t = (role === 'body' || role === 'caption') ? textOf(node) : oneLine(node);\n      if (!t) return;\n      switch(role){\n        case 'h1': out.push('# ' + t.replace(/\\n+/g,' ')); out.push(''); break;\n        case 'h2': out.push('## ' + t.replace(/\\n+/g,' ')); out.push(''); break;\n        case 'h3': out.push('### ' + t.replace(/\\n+/g,' ')); out.push(''); break;\n        case 'eyebrow': out.push('**' + t.replace(/\\n+/g,' ').toUpperCase() + '**'); out.push(''); break;\n        case 'caption': out.push('_' + t.replace(/\\n+/g,' ') + '_'); out.push(''); break;\n        case 'cta': out.push('> **[Button]** ' + t.replace(/\\n+/g,' ')); out.push(''); break;\n        default: out.push(t.replace(/\\n/g,'  \\n')); out.push('');\n      }\n    });\n    return out.join('\\n');\n  }\n\n  /* save action */\n  document.getElementById('saveBtn').addEventListener('click', function(){\n    persist();\n    var stamp = dateStamp();\n    var canDocx = window.docx && window.docx.Document && window.docx.Packer;\n    if (canDocx){\n      try {\n        buildDocx().then(function(blob){\n          download(blob, \"workable-homepage-edits-\" + stamp + \".docx\");\n          showToast(\"Word document downloaded\");\n        }).catch(function(){\n          var md = buildMarkdown();\n          download(new Blob([md], { type:\"text/markdown\" }), \"workable-homepage-edits-\" + stamp + \".md\");\n          showToast(\"Saved as Markdown\");\n        });\n        return;\n      } catch(e){}\n    }\n    var md = buildMarkdown();\n    download(new Blob([md], { type:\"text/markdown\" }), \"workable-homepage-edits-\" + stamp + \".md\");\n    showToast(\"Saved as Markdown\");\n  });\n})();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
